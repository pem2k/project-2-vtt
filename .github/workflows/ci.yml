name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Check backend formatting
        working-directory: backend
        run: npm run format:check

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test backend units
        working-directory: backend
        run: npm run test:unit

  integration:
    name: Database integration and browser E2E
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Set up local Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start disposable local database
        working-directory: backend
        run: supabase start
      - name: Run backend integration tests with real RLS
        working-directory: backend
        run: npm test
      - name: Test room joining, dice broadcasts, and refresh in Chromium
        working-directory: frontend
        run: npm run test:e2e:local
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: frontend/playwright-report/
          retention-days: 3
      - name: Stop disposable database
        if: always()
        working-directory: backend
        run: supabase stop --no-backup

  build:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

  lint-and-test:
    needs: [lint, test, integration, build, security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: |
          lint="${{ needs.lint.result }}"
          test="${{ needs.test.result }}"
          integration="${{ needs.integration.result }}"
          build="${{ needs.build.result }}"
          security="${{ needs.security.result }}"
          echo "lint=$lint test=$test integration=$integration build=$build security=$security"
          if [ "$lint" != "success" ] || [ "$test" != "success" ] || [ "$integration" != "success" ] || [ "$build" != "success" ] || [ "$security" != "success" ]; then
            echo "One or more CI stages failed"
            exit 1
          fi
          echo "CI succeeded"
